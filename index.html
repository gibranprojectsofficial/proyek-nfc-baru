<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review & Rating</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Script Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 select-none">
  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Inisialisasi Konek ke Supabase
    const SUPABASE_URL = 'https://gpvjhfvbwhdkbzfenwai.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ux3OfNw7Jg2tkjf3DSRvkQ_BvYJHbTx';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mengambil Parameter ID dari URL secara otomatis (Contoh: ?id=nfc-01)
    const getQueryParam = (param) => {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param) || 'toko_default';
    };

    const currentStoreId = getQueryParam('id');

    const DEFAULT_DATA = {
      name: `Kedai ${currentStoreId.toUpperCase()}`,
      googleUrl: 'https://search.google.com/local/writereview?placeid=ChIJMRBecQCJJS4RDMvwWkUdNIc',
      phone: '6282180934646',
      pin: '0000'
    };

    function App() {
      const [storeData, setStoreData] = useState(DEFAULT_DATA);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [step, setStep] = useState('rating');
      const [rating, setRating] = useState(0);
      const [hoverRating, setHoverRating] = useState(0);
      const [feedback, setFeedback] = useState('');
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [successMsg, setSuccessMsg] = useState(false);

      // Load data langsung dari SUPABASE berdasarkan ID toko di URL
      useEffect(() => {
        const fetchStoreData = async () => {
          try {
            const { data, error } = await supabaseClient
              .from('Toko')
              .select('*')
              .eq('id', currentStoreId)
              .single();

            if (data) {
              setStoreData({
                name: data.name || `Kedai ${currentStoreId.toUpperCase()}`,
                googleUrl: data.google_url || DEFAULT_DATA.googleUrl,
                phone: data.phone || DEFAULT_DATA.phone,
                pin: data.pin || '0000'
              });
            }
          } catch (err) {
            console.error("Gagal memuat data dari Supabase:", err);
          } finally {
            setLoading(false);
          }
        };

        fetchStoreData();
      }, [currentStoreId]);

      const handleStarClick = (selectedRating) => {
        setRating(selectedRating);
        setTimeout(() => {
          if (selectedRating >= 4) {
            window.location.href = storeData.googleUrl;
          } else {
            setStep('feedback');
          }
        }, 300);
      };

      const handleSendFeedback = (e) => {
        e.preventDefault();
        const waMessage = encodeURIComponent(`💬 Ada masukan nih (Rating ${rating} Bintang):\n"${feedback}"\n\nSiap kita perbaiki demi kenyamanan pelanggan! 🚀`);
        window.location.href = `https://wa.me/${storeData.phone}?text=${waMessage}`; 
      };

      const handleLoginAdmin = (e) => {
        e.preventDefault();
        if (pinInput === storeData.pin) {
          setIsAdmin(true);
        } else {
          alert('PIN Salah!');
        }
      };

      // FUNGSI SIMPAN DATA KE SUPABASE (REAL-TIME)
      const handleSaveSettings = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const { error } = await secClient
            .from('Toko')
            .upsert({ 
              id: currentStoreId,
              name: storeData.name,
              google_url: storeData.googleUrl,
              phone: storeData.phone,
              pin: storeData.pin
            });

          if (error) throw error;

          setIsAdmin(false);
          setStep('rating');
          setSuccessMsg(true);
          setTimeout(() => setSuccessMsg(false), 3000);
        } catch (err) {
          alert("Gagal: " + (err.message || JSON.stringify(err)));
          console.error(err);
        } finally {
          setSaving(false);
        }
      };

      const activeRating = hoverRating || rating;

      if (loading) {
        return (
          <div className="text-center py-12">
            <div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p className="text-slate-400 text-sm">Memuat data toko...</p>
          </div>
        );
      }

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative">
          <div className="absolute bottom-3 right-4">
            <button 
              onClick={() => { setStep('admin'); setPinInput(''); }}
              className="text-xs text-slate-500 hover:text-slate-300 transition"
            >
              Pengaturan
            </button>
          </div>

          {successMsg && (
            <div className="mb-4 p-3 bg-emerald-500/20 border border-emerald-500 text-emerald-300 rounded-xl text-sm text-center">
              Pengaturan Toko Berhasil Disimpan ke Supabase!
            </div>
          )}

          {step === 'rating' && (
            <div className="text-center py-6">
              <div className="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center mb-4 text-2xl font-bold">
                🏢
              </div>
              <h1 className="text-xl font-bold mb-1">{storeData.name}</h1>
              <p className="text-slate-400 text-sm mb-6">gimana pengalaman kamu mampir di sini hari ini?✨</p>
              
              <div className="flex justify-center gap-2 mb-6">
                {[1, 2, 3, 4, 5].map((star) => {
                  const isFilled = star <= activeRating;
                  return (
                    <button
                      key={star}
                      onClick={() => handleStarClick(star)}
                      onMouseEnter={() => setHoverRating(star)}
                      onMouseLeave={() => setHoverRating(0)}
                      onTouchStart={() => setHoverRating(star)}
                      className={`w-12 h-12 rounded-xl text-2xl transition-all duration-200 flex items-center justify-center shadow ${
                        isFilled 
                          ? 'bg-amber-500/20 border border-amber-500 text-amber-400 scale-105' 
                          : 'bg-slate-800 border border-slate-700/50 text-slate-600 hover:border-slate-500'
                      }`}
                    >
                      ★
                    </button>
                  );
                })}
              </div>
              <p className="text-xs text-slate-500">PILIH RATING BINTANG</p>
            </div>
          )}

          {step === 'feedback' && (
            <div>
              <h2 className="text-lg font-bold mb-2">OTW Jadi Lebih Baik! 🚀</h2>
              <p className="text-slate-400 text-sm mb-4">Bisikin ke kita aja di sini! Curhatan kamu aman kok, enggak bakal di-spill ke mana-mana. Kita siap perbaiki demi kenyamanan kamu next time!</p>
              <form onSubmit={handleSendFeedback}>
                <textarea
                  rows="4"
                  value={feedback}
                  onChange={(e) => setFeedback(e.target.value)}
                  placeholder="Tulis curhatan atau masukan kamu di sini..."
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 mb-4"
                  required
                ></textarea>
                <button
                  type="submit"
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm"
                >
                  Bantu Kami Lakukan Perbaikan 🚀
                </button>
                <button
                  type="button"
                  onClick={() => { setStep('rating'); setRating(0); }}
                  className="w-full mt-2 bg-transparent hover:bg-slate-800 text-slate-400 py-2 rounded-xl transition text-sm"
                >
                  Kembali
                </button>
              </form>
            </div>
          )}

          {step === 'admin' && (
            <div>
              {!isAdmin ? (
                <form onSubmit={handleLoginAdmin}>
                  <h2 className="text-lg font-bold mb-2">Masukan PIN Admin</h2>
                  <p className="text-slate-400 text-sm mb-4">Masukkan PIN untuk mengubah tautan atau nomor WhatsApp.</p>
                  <input
                    type="password"
                    maxLength="4"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="PIN (Default: 0000)"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 mb-4 tracking-widest text-center"
                    required
                  />
                  <button
                    type="submit"
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm mb-2"
                  >
                    Masuk
                  </button>
                  <button
                    type="button"
                    onClick={() => setStep('rating')}
                    className="w-full bg-transparent hover:bg-slate-800 text-slate-400 py-2 rounded-xl transition text-sm"
                  >
                    Batal
                  </button>
                </form>
              ) : (
                <form onSubmit={handleSaveSettings}>
                  <h2 className="text-lg font-bold mb-4">Pengaturan Toko ({currentStoreId})</h2>
                  
                  <div className="mb-3">
                    <label className="block text-xs text-slate-400 mb-1">Nama Toko</label>
                    <input
                      type="text"
                      value={storeData.name}
                      onChange={(e) => setStoreData({...storeData, name: e.target.value})}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100"
                      required
                    />
                  </div>

                  <div className="mb-3">
                    <label className="block text-xs text-slate-400 mb-1">Link Google Review / Maps</label>
                    <input
                      type="text"
                      value={storeData.googleUrl}
                      onChange={(e) => setStoreData({...storeData, googleUrl: e.target.value})}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100"
                      required
                    />
                  </div>

                  <div className="mb-3">
                    <label className="block text-xs text-slate-400 mb-1">Nomor WhatsApp (Diawali 62)</label>
                    <input
              type="text"
              value={storeData.phone}
              onChange={(e) => setStoreData({...storeData, phone: e.target.value})}
              className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100"
              required
            />
                  </div>

                  <div className="mb-5">
                    <label className="block text-xs text-slate-400 mb-1">PIN Baru (4 Angka)</label>
                    <input
                      type="text"
                      maxLength="4"
                      value={storeData.pin}
                      onChange={(e) => setStoreData({...storeData, pin: e.target.value})}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={saving}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition text-sm mb-2 disabled:opacity-50"
                  >
                    {saving ? 'Menyimpan...' : 'Simpan Perubahan'}
                  </button>
                  <button
                    type="button"
                    onClick={() => setStep('rating')}
                    className="w-full bg-transparent hover:bg-slate-800 text-slate-400 py-2 rounded-xl transition text-sm"
                  >
                    Kembali
                  </button>
                </form>
              )}
            </div>
          )}

          <div className="text-center mt-6 text-xs text-slate-600">
            Powered by NFC System & Supabase
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
